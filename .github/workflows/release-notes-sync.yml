# Maintainer tool: re-sync a published release's title and notes with CHANGELOG.md.
# Run manually (Actions -> "Release notes sync" -> Run workflow). Changes no binaries, tags or assets.
name: Release notes sync
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.7.0"
        required: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: update title and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a SemVer tag: $TAG"; exit 1; }
          v=${TAG#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md | sed '/./,$!d' > /tmp/notes.md
          [ -s /tmp/notes.md ] || { echo "::error::CHANGELOG.md has no section '## [$v]'"; exit 1; }
          gh release edit "$TAG" --title "mtmon $TAG" --notes-file /tmp/notes.md