name: release
# Tag setzen (z. B. v2.0.0) -> Build -> GitHub Release mit festem Asset-Namen (wird von install.sh geladen)
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: sudo apt-get install -y shellcheck
      - run: make test
      - run: staticcheck ./...
      - run: cd deploy && shellcheck -x -s bash lib.sh install-mtmon.sh update-mtmon.sh uninstall-mtmon.sh
      - run: cd deploy && shellcheck -s sh update-geo.sh
      - run: shellcheck install.sh
      - run: test -z "$(gofmt -l .)"
      - run: make build
      - run: sudo deploy/test/test-deploy.sh bin/mtmon
      - run: make release
      - name: stable asset names
        run: |
          cd dist
          cp mtmon-*-linux-amd64.tar.gz mtmon-linux-amd64.tar.gz
          sha256sum mtmon-linux-amd64.tar.gz > mtmon-linux-amd64.tar.gz.sha256
      - name: publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/mtmon-linux-amd64.tar.gz dist/mtmon-linux-amd64.tar.gz.sha256 --title "$GITHUB_REF_NAME" --generate-notes
