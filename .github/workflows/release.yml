name: release
# Tag setzen (z. B. v0.5.0, SemVer; Eintrag in CHANGELOG.md Pflicht) -> Build -> GitHub Release mit festem Asset-Namen (wird von install.sh geladen)
# Alternativ ohne lokales Git: Actions -> release -> Run workflow, Eingabe "tag" (z. B. v0.8.0). Der Lauf nimmt den aktuellen Stand von main
# und legt das Tag beim Veroeffentlichen selbst an.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create from main, e.g. v0.8.0"
        required: true
permissions:
  contents: write
  actions: read        # CI gate
  id-token: write      # build provenance attestation
  attestations: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  VERSION: ${{ inputs.tag || github.ref_name }} # make uses it instead of git describe: the binary must report exactly the release tag
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: manual runs only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: echo "::error::run this workflow on branch main"; exit 1
      - name: validate tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::tag '$TAG' is not SemVer (vMAJOR.MINOR.PATCH)"; exit 1; }
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: CI must be green for this commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # tests, lint and deploy tests already ran in ci.yml on this exact commit; no need to repeat them here
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
          [ "${n:-0}" -ge 1 ] || { echo "::error::no successful CI run found for $GITHUB_SHA - merge to main and wait for CI first"; exit 1; }
      - name: release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::tag $TAG is not SemVer (vMAJOR.MINOR.PATCH)"; exit 1; }
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md | sed '/./,$!d' > /tmp/notes.md
          [ -s /tmp/notes.md ] || { echo "::error::CHANGELOG.md has no section '## [$v]'"; exit 1; }
          printf '\n---\n**Install / update on Proxmox VE 9:** `bash -c "$(curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh)"` and choose *install* or *update*.\n' "$GITHUB_REPOSITORY" >> /tmp/notes.md
      - run: make release
      - name: stable asset names
        run: |
          cd dist
          cp mtmon-*-linux-amd64.tar.gz mtmon-linux-amd64.tar.gz
          sha256sum mtmon-linux-amd64.tar.gz > mtmon-linux-amd64.tar.gz.sha256
      - name: sign archive (minisign)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          [ -n "$MINISIGN_KEY" ] || { echo "::error::secret MINISIGN_KEY is not set; refusing to publish an unsigned release"; exit 1; }
          sudo apt-get install -y minisign
          umask 077
          key=$(mktemp); trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          # trusted comment binds the signature to this tag (the updater checks it)
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m dist/mtmon-linux-amd64.tar.gz -t "mtmon $TAG"
          # verify with the public key committed in the repo before anything is published
          pub=$(sed -n 2p minisign.pub)
          minisign -Vm dist/mtmon-linux-amd64.tar.gz -P "$pub"
      - name: build provenance attestation
        uses: actions/attest-build-provenance@v4
        with: { subject-path: dist/mtmon-linux-amd64.tar.gz }
      - name: publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$TAG" --target "$GITHUB_SHA" dist/mtmon-linux-amd64.tar.gz dist/mtmon-linux-amd64.tar.gz.sha256 dist/mtmon-linux-amd64.tar.gz.minisig --title "mtmon $TAG" --notes-file /tmp/notes.md $( [[ "$TAG" == *-* ]] && echo --prerelease )
