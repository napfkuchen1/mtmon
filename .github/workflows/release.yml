name: release
# Tag setzen (z. B. v0.5.0, SemVer; Eintrag in CHANGELOG.md Pflicht) -> Build -> GitHub Release mit festem Asset-Namen (wird von install.sh geladen)
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: sudo apt-get install -y shellcheck
      - run: make test
      - run: staticcheck ./...
      - run: cd deploy && shellcheck -x -s bash lib.sh install-mtmon.sh update-mtmon.sh uninstall-mtmon.sh
      - run: cd deploy && shellcheck -s sh update-geo.sh apply-update.sh
      - run: shellcheck install.sh deploy/test/test-tui.sh deploy/test/test-apply-update.sh
      - run: test -z "$(gofmt -l .)"
      - run: make build
      - name: deploy tests
        run: |
          { sudo deploy/test/test-deploy.sh bin/mtmon && sudo deploy/test/test-tui.sh && deploy/test/test-apply-update.sh; } > /tmp/dt.log 2>&1 || { m=$(grep -v '^PASS' /tmp/dt.log | tail -15 | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error::$m"; exit 1; }
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::tag $GITHUB_REF_NAME is not SemVer (vMAJOR.MINOR.PATCH)"; exit 1; }
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md | sed '/./,$!d' > /tmp/notes.md
          [ -s /tmp/notes.md ] || { echo "::error::CHANGELOG.md has no section '## [$v]'"; exit 1; }
          printf '\n---\n**Install / update on Proxmox VE 9:** `bash -c "$(curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh)"` and choose *install* or *update*.\n' "$GITHUB_REPOSITORY" >> /tmp/notes.md
      - run: make release
      - name: stable asset names
        run: |
          cd dist
          cp mtmon-*-linux-amd64.tar.gz mtmon-linux-amd64.tar.gz
          sha256sum mtmon-linux-amd64.tar.gz > mtmon-linux-amd64.tar.gz.sha256
      - name: publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/mtmon-linux-amd64.tar.gz dist/mtmon-linux-amd64.tar.gz.sha256 --title "mtmon $GITHUB_REF_NAME" --notes-file /tmp/notes.md $( [[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease )
