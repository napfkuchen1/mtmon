name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: sudo apt-get install -y shellcheck
      - run: make test
      - run: staticcheck ./...
      - run: cd deploy && shellcheck -x -s bash lib.sh install-mtmon.sh update-mtmon.sh uninstall-mtmon.sh
      - run: cd deploy && shellcheck -s sh update-geo.sh
      - run: shellcheck install.sh deploy/test/test-tui.sh
      - run: test -z "$(gofmt -l .)"
      - run: make build
      - name: deploy tests
        run: |
          { sudo deploy/test/test-deploy.sh bin/mtmon && sudo deploy/test/test-tui.sh; } > /tmp/dt.log 2>&1 || { m=$(grep -v '^PASS' /tmp/dt.log | tail -15 | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error::$m"; exit 1; }