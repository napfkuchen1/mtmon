name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - run: node scripts/spdx.js # every source file carries its SPDX licence line
      - run: node scripts/licenses.js --check # dependency licences stay AGPL-compatible
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1 # pinned: a new staticcheck release must not turn CI red on its own
      - run: sudo apt-get install -y shellcheck
      - run: make test
      - run: staticcheck ./...
      - run: cd deploy && shellcheck -x -s bash lib.sh install-mtmon.sh update-mtmon.sh uninstall-mtmon.sh
      - run: cd deploy && shellcheck -s sh update-geo.sh apply-update.sh
      - run: shellcheck install.sh deploy/test/test-tui.sh deploy/test/test-apply-update.sh
      - run: test -z "$(gofmt -l .)"
      - run: make build
      - name: deploy tests
        run: |
          { sudo deploy/test/test-deploy.sh bin/mtmon && sudo deploy/test/test-tui.sh && deploy/test/test-apply-update.sh; } > /tmp/dt.log 2>&1 || { m=$(grep -v '^PASS' /tmp/dt.log | tail -15 | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error::$m"; exit 1; }
  # Known-vulnerability scan of the Go dependencies and standard library. Reports only (does not block) so that a newly
  # published advisory cannot stop unrelated work; read the log and bump go.mod / dependencies when it lists something.
  vuln:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: mkdir -p web/dist && touch web/dist/.gitkeep   # go:embed needs the directory to exist
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm audit --omit=dev --audit-level=high   # npm dependencies shipped in the UI bundle
  # Code-health info (does not block): functions above cyclomatic complexity 25 and copy-pasted blocks of 100+ tokens.
  # Use the list to pick the next function to split; tighten or drop the thresholds on purpose.
  health:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
      - run: go install github.com/mibk/dupl@v1.0.0
      - run: gocyclo -over 25 $(git ls-files '*.go' | grep -v _test.go) | tee /dev/stderr | wc -l
      - run: dupl -threshold 100 -plumbing $(git ls-files '*.go' | grep -v _test.go) | head -40
