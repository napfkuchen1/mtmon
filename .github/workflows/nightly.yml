name: nightly
# Heavy checks that are too slow for every PR: query latency at scale, fuzzing, and a demo end-to-end smoke test.
# Failures show up as a red run on the Actions tab (and the usual notification mail); nothing here gates merges.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  scale:
    # every query on a 100 clients x 30 days data set must stay under 500 ms (TestScale)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: mkdir -p web/dist && touch web/dist/.gitkeep # go:embed needs the directory
      - run: make scale

  fuzz:
    # 60 s per fuzz target; a crashing input is uploaded so it can be added to testdata/fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/flow, target: FuzzDecode }
          - { pkg: ./internal/syslog, target: FuzzParse }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s ${{ matrix.pkg }}
      - name: keep the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}
          if-no-files-found: ignore

  e2e:
    # demo stack on loopback: mockros (two fake routers) + mtmon + flowgen, then API checks (scripts/e2e-smoke.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make build
      - run: scripts/e2e-smoke.sh
